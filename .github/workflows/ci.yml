name: CI

# Build → test (cổng cứng) → deploy staging (chỉ nhánh GCP_Deploy, qua WIF — Phase 6, fork 2A).
on:
  push:
    branches: [main, develop, "feat/**", "integrate-**", GCP_Deploy]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"          # khớp Dockerfile (python:3.12-slim) & .venv cục bộ
          cache: pip
      - run: pip install -r requirements-dev.txt

      - name: Lint (ruff)                  # cổng CỨNG
        run: ruff check app tests

      - name: Typecheck (mypy) — advisory
        # Nợ kiểu sau migration: ~42 lỗi ở nhiều module (code cũ + ELT serving). Chạy để THEO DÕI,
        # CHƯA chặn build; bật cổng cứng sau khi dọn nợ dần. (Con số có thể đổi khi thêm code.)
        run: mypy app
        continue-on-error: true

      - name: Test (pytest)                # cổng CỨNG — testpaths=tests trong pyproject.toml
        run: pytest

      - name: Security audit (pip-audit) — advisory
        # Quét lỗ hổng phụ thuộc. Advisory vì advisory upstream (dep bắc cầu) không do ta kiểm soát;
        # xem log để xử lý, không để CI đỏ vì thứ ngoài tầm.
        run: pip-audit --requirement requirements.txt
        continue-on-error: true

  docker:
    runs-on: ubuntu-latest
    needs: quality                          # chỉ build image sau khi lint + test xanh
    # Trên nhánh GCP_Deploy, deploy-staging đã build+push image → khỏi build lại (đỡ trùng).
    if: "!(github.event_name == 'push' && github.ref == 'refs/heads/GCP_Deploy')"
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t jobs-serving-api:ci .

  # ---- deploy STAGING (Phase 6 — fork 2A: chỉ push GCP_Deploy, tự động qua WIF) ----
  # Image tag = commit SHA → Artifact Registry → deploy staging bằng infra/gcp/deploy-cloud-run.sh.
  # WIF (không JSON key): output của 50-wif dán vào 3 secret repo dưới đây.
  #   secrets.GCP_PROJECT_ID   — Project ID (vd jobs-serving-471203)
  #   secrets.GCP_WIF_PROVIDER — projects/<num>/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  #   secrets.GCP_DEPLOYER_SA  — sa-ci-deployer-staging@<project>.iam.gserviceaccount.com
  #   secrets.SMOKE_API_KEY    — (tuỳ chọn) key THÔ để smoke /v1; hash của nó phải nằm trong api-keys staging.
  # PUBLIC_ACCESS=0: CI (run.developer) KHÔNG set IAM public — bind 1 lần bằng allow-public.sh (owner).
  # Smoke (cụm 6.3, Cách 2) = CỔNG CỨNG: gọi service private bằng identity token (cần run.invoker ở 21).
  deploy-staging:
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/GCP_Deploy'
    permissions:
      contents: read
      id-token: write                       # BẮT BUỘC cho WIF (GitHub xuất OIDC token)
    steps:
      - uses: actions/checkout@v4

      - name: Auth GCP qua WIF (không JSON key)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Dựng config.sh cho script infra (từ example + inject PROJECT_ID)
        # Giữ MỘT nguồn sự thật: mọi tên (region, dataset, SA, secret, AR) lấy từ config.example.sh
        # đã commit; CI chỉ chèn PROJECT_ID (giá trị riêng, không commit).
        run: |
          cp infra/gcp/config.example.sh infra/gcp/config.sh
          sed -i "s|^export PROJECT_ID=.*|export PROJECT_ID=\"${{ secrets.GCP_PROJECT_ID }}\"|" infra/gcp/config.sh

      - name: Build & push image (tag = commit SHA)
        run: |
          set -euo pipefail
          source infra/gcp/config.sh
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${AR_IMAGE}:${GITHUB_SHA}"
          echo "Building ${IMAGE}"
          docker build -t "${IMAGE}" .
          docker push "${IMAGE}"

      - name: Deploy Cloud Run (staging, memory-first, private) + lấy URL
        id: deploy
        # PUBLIC_ACCESS=0 → không chạm IAM (run.developer đủ). Public cho người dùng thật: chạy
        # 1 lần bash allow-public.sh staging (owner). Smoke dưới đây KHÔNG cần public (dùng bearer).
        run: |
          set -euo pipefail
          IMAGE_TAG="${GITHUB_SHA}" PUBLIC_ACCESS=0 bash infra/gcp/deploy-cloud-run.sh staging
          source infra/gcp/config.sh
          URL="$(gcloud run services describe "${RUN_SERVICE_STAGING}" \
            --region="${REGION}" --project="${PROJECT_ID}" --format='value(status.url)')"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "Service URL: ${URL}"

      - name: Mint identity token cho service URL (gọi service PRIVATE)
        id: idtoken
        # workloadIdentityUser (50-wif) đã có getOpenIdToken → mint được, KHÔNG cần tokenCreator.
        # Deployer SA cần run.invoker (21-iam-bindings) để token được service chấp nhận.
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}
          token_format: id_token
          id_token_audience: ${{ steps.deploy.outputs.url }}
          id_token_include_email: true

      - name: Smoke test (CỔNG CỨNG — fail thì pipeline đỏ)
        # AUTH_BEARER = identity token → qua được tầng invoker dù service còn private.
        # /v1 cần thêm X-API-Key: đặt secret SMOKE_API_KEY (key thô, hash nằm trong api-keys staging)
        # để smoke đủ /v1; thiếu key thì smoke chỉ chạy /health + kiểm 401 (vẫn là cổng).
        run: |
          BASE_URL="${{ steps.deploy.outputs.url }}" \
          API_KEY="${{ secrets.SMOKE_API_KEY }}" \
          AUTH_BEARER="${{ steps.idtoken.outputs.id_token }}" \
          bash infra/gcp/smoke.sh
