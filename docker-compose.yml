# MẶC ĐỊNH (migration Phase 0):  docker compose up --build
#   → chỉ chạy  redis + api (backend `fake`, dữ liệu mẫu)  — boot sạch, KHÔNG cần MySQL/DuckDB.
#     API tại http://localhost:8082 (X-API-Key: dev-local-key-team-ai).
#
# LEGACY (pipeline MySQL → DuckDB của Tuần 7, GIỮ LẠI dưới profile, KHÔNG chạy mặc định):
#   docker compose --profile legacy-duckdb up --build mysql elt-init   # chỉ dựng lại kho DuckDB cũ
#   (KHÔNG dùng `up` trơn với profile này vì nó kéo theo cả api+redis mặc định). LƯU Ý: serving từ DuckDB
#   đang TẠM tắt (settings từ chối warehouse_backend=duckdb) → khôi phục ở Phase 4.
# Xem docs/adr/ADR-014/015/018. Deploy thật: Cloud Run+BigQuery (Phase 6), VM+MongoDB (Phase 7).

services:
  # ---------- Nguồn OLTP (LEGACY — chỉ chạy với --profile legacy-duckdb) ----------
  mysql:
    image: mysql:8
    profiles: ["legacy-duckdb"]
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: jobportal
    volumes:
      # Chạy 1 LẦN khi volume rỗng, theo thứ tự alphabet: database.sql trước, rồi tạo user reader.
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql:ro
      - ./scripts/init-reader-user.sql:/docker-entrypoint-initdb.d/init-reader-user.sql:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      # DÙNG 127.0.0.1 (TCP), KHÔNG dùng 'localhost' (socket). Khi mysql init lần đầu, nó chạy một
      # temporary server CHỈ nghe qua socket để nạp *.sql — ping qua socket sẽ "xanh giả" quá sớm,
      # khiến elt-init chạy trước rồi nối TCP mysql:3306 bị refused. Ép TCP 127.0.0.1 để chỉ xanh
      # khi server THẬT đã mở cổng 3306.
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-P",
          "3306",
          "-uroot",
          "-prootpw",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s # dành thời gian cho lần init đầu (nạp database.sql) trước khi tính retries
    # Không publish cổng ra host: API nói chuyện với MySQL trong mạng nội bộ của compose.

  # ---------- Cache + rate-limit chia sẻ ----------
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------- Job ELT khởi tạo (LEGACY one-shot, profile legacy-duckdb) ----------
  # Dùng CHUNG image với api. Bóc MySQL → silver_jobs, rồi nướng gold, ghi vào /data/analytics.duckdb.
  # Chạy xong THOÁT (0). KHÔNG gate api 'fake' mặc định (api không còn depends_on elt-init); chỉ dựng lại
  # kho DuckDB cũ khi cần — serving từ DuckDB tạm tắt tới Phase 4.
  elt-init:
    build: .
    profiles: ["legacy-duckdb"]
    command: sh -c "python -m app.elt.build_silver && python -m app.elt.build_gold"
    environment:
      JOBS_API_MYSQL_URL: mysql+pymysql://reader:reader_pw@mysql:3306/jobportal # user CHỈ-ĐỌC
      JOBS_API_DUCKDB_PATH: /data/analytics.duckdb
    volumes:
      - duckdb_data:/data
    depends_on:
      mysql:
        condition: service_healthy # đợi MySQL THẬT SỰ sẵn sàng, không chỉ 'đã khởi động'

  # ---------- Tầng phục vụ ----------
  api:
    build: .
    ports:
      - "8082:8080"
    environment:
      JOBS_API_ENV: local # local: tự seed key dev 'dev-local-key-team-ai' cho demo
      JOBS_API_LOG_FORMAT: json # container -> log JSON để observability đọc
      JOBS_API_WAREHOUSE_BACKEND: fake # migration Phase 0: CHỈ 'fake' khả dụng (bigquery Phase 3, duckdb Phase 4)
      JOBS_API_CACHE_BACKEND: redis
      JOBS_API_REDIS_URL: redis://redis:6379/0
      JOBS_API_RATE_LIMITER_BACKEND: redis # RedisRateLimiter — đúng cho nhiều instance
      # PROD (Cloud Run, Phase 6): bỏ JOBS_API_ENV=local, ĐẶT JOBS_API_API_KEYS + PAGE_TOKEN_SECRET qua Secret Manager.
    depends_on:
      redis:
        condition: service_healthy

volumes:
  mysql_data: # dữ liệu MySQL, sống độc lập với container
  duckdb_data: # kho DuckDB do elt-init ghi, api đọc
